apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-tempo-config"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  tempo.yaml: |
    multitenancy_enabled: {{ .Values.tempo.multitenancy.enabled | default false }}

    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    memberlist:
      node_name: "${HOSTNAME}"
      bind_port: 7946
      join_members:
        - "{{ .Release.Name }}-tempo-headless.{{ .Release.Namespace }}.svc.cluster.local:7946"

    ingester:
      max_block_duration: 1h
      trace_idle_period: 10s

    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retention | default "48h" | quote }}
        compacted_block_retention: 1h

    querier:
      max_concurrent_queries: 20

    query_frontend:
      search:
        max_duration: 0

    storage:
      trace:
        backend: s3
        s3:
          endpoint: "{{ .Release.Name }}-minio:9000"
          bucket: {{ .Values.tempo.s3.bucketName | default "tempo-data" | quote }}
          access_key: "${S3_ACCESS_KEY_ID}"
          secret_key: "${S3_SECRET_ACCESS_KEY}"
          insecure: true
          forcepathstyle: true
        wal:
          path: /var/tempo/wal