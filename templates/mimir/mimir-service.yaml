apiVersion: v1
kind: Service
metadata:
    name: "{{ .Release.Name }}-mimir"
    namespace: {{ .Release.Namespace }}
    labels:
        app.kubernetes.io/name: mimir
        app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.mimir.servicePort | default "9009" }}
      targetPort: {{ .Values.mimir.servicePort | default "9009" }}
    - name: grpc
      port: 9095
      targetPort: 9095