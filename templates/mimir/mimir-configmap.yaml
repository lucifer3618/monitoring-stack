apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-mimir-config"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  mimir.yaml: |
    multitenancy_enabled: {{ .Values.mimir.multitenancy.enabled | default false }}

    target: all,alertmanager,overrides-exporter

    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
      log_level: info

    activity_tracker:
      filepath: /var/mimir/metrics-activity.log

    # Memberlist ring for horizontal scale and node discovery
    memberlist:
      node_name: "${HOSTNAME}"
      bind_port: 7946
      join_members:
        - "{{ .Release.Name }}-mimir-headless.{{ .Release.Namespace }}.svc.cluster.local:7946"

    # Ingester settings
    ingester:
      ring:
        replication_factor: {{ .Values.mimir.ingester.replicationFactor | default 2 }}

    # Storage blocks configuration (MinIO S3)
    blocks_storage:
      backend: s3
      s3:
        endpoint: "{{ .Release.Name }}-minio:9000"
        bucket_name: {{ .Values.mimir.s3.bucketName | default "mimir-data" | quote }}
        access_key_id: "${S3_ACCESS_KEY_ID}"
        secret_access_key: "${S3_SECRET_ACCESS_KEY}"
        insecure: true
      tsdb:
        dir: /var/mimir/tsdb
        block_ranges_period: ["2h"]
        retention_period: {{ .Values.mimir.retentionPeriod | default "24h" | quote }}
        ship_concurrency: 10

    # Compactor merges 2h blocks into larger blocks in MinIO
    compactor:
      data_dir: /var/mimir/compactor
      sharding_ring:
        kvstore:
          store: memberlist

    # Store-gateway reads cold blocks from MinIO
    store_gateway:
      sharding_ring:
        replication_factor: {{ .Values.mimir.storeGateway.replicationFactor | default 2 }}
        kvstore:
          store: memberlist

    # Ingestion limits and limits configuration
    limits:
      max_global_series_per_user: 500000
      max_global_series_per_metric: 50000