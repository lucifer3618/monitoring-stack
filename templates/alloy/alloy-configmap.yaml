apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-alloy-config"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.alloy: |
    // ==========================================
    // 1. METRICS PIPELINE (Mimir)
    // ==========================================

    // --- Host / Node Metrics (Node Exporter) ---
    prometheus.exporter.unix "node" { }

    prometheus.scrape "node_metrics" {
      targets         = prometheus.exporter.unix.node.targets
      forward_to      = [prometheus.remote_write.mimir.receiver]
      scrape_interval = "15s"
    }

    // --- cAdvisor (Container CPU, Memory & Working Set) ---
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = env("HOSTNAME")
      }

      rule {
        target_label = "__metrics_path__"
        replacement  = "/metrics/cadvisor"
      }

      rule {
        target_label = "__scheme__"
        replacement  = "https"
      }
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.cadvisor.output
      forward_to        = [prometheus.remote_write.mimir.receiver]
      scrape_interval   = "15s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    // --- Kube-State-Metrics (Pod Phase, Status & Container Restarts) ---
    discovery.kubernetes "ksm_services" {
      role = "service"
      namespaces {
        names = ["monitoring", "kube-system", "{{ .Release.Namespace }}"]
      }
    }

    discovery.relabel "ksm" {
      targets = discovery.kubernetes.ksm_services.targets

      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_service_name"]
        regex         = ".*kube-state-metrics.*"
      }

      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_service_port_name"]
        regex         = "http|http-metrics|metrics"
      }
    }

    prometheus.scrape "kube_state_metrics" {
      targets         = discovery.relabel.ksm.output
      forward_to      = [prometheus.remote_write.mimir.receiver]
      scrape_interval = "30s"
    }

    // --- Pod Annotation Scraping (prometheus.io/scrape: "true") ---
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "scrape_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = env("HOSTNAME")
      }

      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
      }

      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        target_label  = "__metrics_path__"
        regex         = "(.+)"
      }

      rule {
        action        = "replace"
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        target_label  = "__address__"
        regex         = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "k8s_pods" {
      targets         = discovery.relabel.scrape_pods.output
      forward_to      = [prometheus.remote_write.mimir.receiver]
      scrape_interval = "15s"
    }

    // --- Mimir Remote Write Forwarder ---
    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://{{ .Release.Name }}-mimir.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.mimir.servicePort | default "9009" }}/api/v1/push"
      }
    }

    // ==========================================
    // 2. LOGS PIPELINE (Loki)
    // ==========================================
    discovery.kubernetes "pod_logs" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pod_logs.targets

      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = env("HOSTNAME")
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url = "http://{{ .Release.Name }}-loki.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.loki.servicePort | default "3100" }}/loki/api/v1/push"
      }
    }

    // ==========================================
    // 3. TRACES & APP METRICS PIPELINE (Tempo & Mimir)
    // ==========================================
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        traces  = [otelcol.processor.batch.default.input]
        metrics = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        traces  = [otelcol.exporter.otlp.tempo.input]
        metrics = [otelcol.exporter.prometheus.mimir.input]
      }
    }

    // Export traces to Tempo
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "{{ .Release.Name }}-tempo.{{ .Release.Namespace }}.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }

    // Convert OTLP metrics to Prometheus format and forward to Mimir
    otelcol.exporter.prometheus "mimir" {
      forward_to = [prometheus.remote_write.mimir.receiver]
    }