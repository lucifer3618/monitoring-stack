apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Namespace }}-loki"
  namespace: {{ .Release.Namespace }}
  labels:
    app: loki
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: grpc
      port: 9095
      targetPort: 9095