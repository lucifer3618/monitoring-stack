apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Release.Name }}-loki"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.loki.replicas | default 1 }}
  serviceName: "{{ .Release.Name }}-loki-headless"
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
          fsGroup: 10001
          runAsUser: 10001
          runAsNonRoot: true
      containers:
        - name: loki
          image: "grafana/loki:{{ .Values.loki.image.tag | default '3.0.0' }}"
          imagePullPolicy: {{ .Values.loki.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9095
            - name: memberlist
              containerPort: 7946
          env:
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-loki-secret"
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-loki-secret"
                  key: S3_SECRET_ACCESS_KEY
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-storage
              mountPath: /var/loki
          resources:
            requests:
              cpu: {{ .Values.loki.resources.requests.cpu | default "100m" }}
              memory: {{ .Values.loki.resources.requests.memory | default "128Mi" }}
            limits:
              cpu: {{ .Values.loki.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.loki.resources.limits.memory | default "512Mi" }}
      volumes:
        - name: loki-config
          configMap:
            name: "{{ .Release.Name }}-loki-config"
            
  volumeClaimTemplates:
    - metadata:
        name: loki-storage
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: {{ .Values.loki.pvc.storageClassName | default "longhorn" }}
        resources:
          requests:
            storage: {{ .Values.loki.pvc.size | default "5Gi" }}
                