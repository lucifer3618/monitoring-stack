apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-loki-config"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    common:
      path_prefix: /var/loki
      storage:
        s3:
          endpoint: "{{ .Release.Name }}-minio:9000"
          bucketnames: "{{ .Values.loki.s3.bucketName }}"
          access_key_id: "${S3_ACCESS_KEY_ID}"
          secret_access_key: "${S3_SECRET_ACCESS_KEY}"
          s3forcepathstyle: true
          insecure: true
      replication_factor: {{ .Values.loki.replicas | default 1 }}

    memberlist:
      node_name: "${HOSTNAME}"
      bind_port: 7946
      join_members:
        - "{{ .Release.Name }}-loki-headless.{{ .Release.Namespace }}.svc.cluster.local:7946"
        
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: false