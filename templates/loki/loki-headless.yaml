apiVersion: v1
kind: Service
metadata:
    name: "{{ .Release.Name }}-loki-headless"
    namespace: {{ .Release.Namespace }}
    labels:
        app: loki
spec:
    clusterIP: None
    selector:
        app: loki
    ports:
        - name: http
          port: 3100
          targetPort: 3100
        - name: grpc
          port: 9095
          targetPort: 9095
        - name: memberlist
          port: 7946
          targetPort: 7946