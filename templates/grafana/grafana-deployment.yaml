apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-grafana"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.grafana.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            # Admin Security Credentials
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | default "admin" | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | default "adminpassword123" | quote }}
            - name: GF_SECURITY_SECRET_KEY
              value: {{ .Values.grafana.secretKey | default "monitoring-stack-secret-ha-key" | quote }}

            # Server Configuration
            - name: GF_SERVER_DOMAIN
              value: "{{ .Values.grafana.ingress.host | default "grafana.home.arpa" }}"
            - name: GF_SERVER_ROOT_URL
              value: "http://{{ .Values.grafana.ingress.host | default "grafana.home.arpa" }}/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"

            # Disable dynamic background app installation drift across HA replicas
            - name: GF_PLUGINS_ENABLE_ALPHA
              value: "false"
            - name: GF_PLUGINS_APPS_AUTO_INSTALL
              value: "false"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: ""

            # Live WebSocket Settings
            - name: GF_LIVE_ALLOWED_ORIGINS
              value: "*"
            
            # Database Configuration (Connects to CloudNativePG RW Service)
            - name: GF_DATABASE_TYPE
              value: {{ .Values.grafana.database.type | default "postgres" | quote }}
            - name: GF_DATABASE_HOST
              value: "{{ .Values.database.clusterName }}-rw.{{ .Release.Namespace }}.svc.cluster.local:5432"
            - name: GF_DATABASE_NAME
              value: {{ .Values.database.name | default "grafana" | quote }}
            - name: GF_DATABASE_USER
              value: {{ .Values.database.user | default "grafana" | quote }}
            - name: GF_DATABASE_PASSWORD
              value: {{ .Values.database.password | default "grafanadbpassword123" | quote }}
            - name: GF_DATABASE_SSL_MODE
              value: {{ .Values.grafana.database.sslMode | default "disable" | quote }}
            # Prevent simultaneous DB migration crashes
            - name: GF_DATABASE_MIGRATION_LOCK_ATTEMPTS
              value: "100"
            - name: GF_DATABASE_MIGRATION_LOCK_TIMEOUT
              value: "300s"

          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
          
          resources:
            requests:
              cpu: {{ .Values.grafana.resources.requests.cpu | default "100m" }}
              memory: {{ .Values.grafana.resources.requests.memory | default "128Mi" }}
            limits:
              cpu: {{ .Values.grafana.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.grafana.resources.limits.memory | default "512Mi" }}

      volumes:
        - name: datasources-volume
          configMap:
            name: "{{ .Release.Name }}-grafana-datasources"
          
          
            
