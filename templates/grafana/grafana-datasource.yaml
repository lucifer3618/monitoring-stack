apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-grafana-datasources"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      # ---------------------------
      # 1. Prometheus / Mimir
      # ---------------------------
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-mimir.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.mimir.servicePort | default "9009" }}/prometheus
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s

      # ---------------------------
      # 2. Loki Logs
      # ---------------------------
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://{{ .Release.Name }}-loki.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.loki.servicePort | default "3100" }}
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: "(?:traceID|trace_id)=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"

      # ---------------------------
      # 3. Tempo Traces
      # ---------------------------
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://{{ .Release.Name }}-tempo.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.tempo.servicePort | default "3200" }}
        isDefault: false
        editable: false
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: "loki"
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            filterByTraceID: true
            filterBySpanID: true
          tracesToMetrics:
            datasourceUid: "prometheus"
            tags: [{ key: "service.name", value: "service" }]
          serviceMap:
            datasourceUid: "prometheus"