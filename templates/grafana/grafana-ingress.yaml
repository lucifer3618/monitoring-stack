apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-grafana"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Sticky Session configuration
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "grafana_stick"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # HTTPS Redirect toggle based on TLS status
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.grafana.ingress.tls.enabled | default false | quote }}
spec:
  ingressClassName: {{ .Values.grafana.ingress.className | default "nginx" }}
  {{- if .Values.grafana.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.grafana.ingress.host | default "grafana.lab.local" | quote }}
      secretName: {{ .Values.grafana.ingress.tls.secretName | default "monitoring-tls-secret" }}
  {{- end }}
  rules:
    - host: {{ .Values.grafana.ingress.host | default "grafana.lab.local" | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ .Release.Name }}-grafana"
                port:
                  number: 3000