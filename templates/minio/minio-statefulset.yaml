apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Release.Name }}-minio"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- $minioReplicas := .Values.minio.replicas | default 1 | int }}
  {{- if gt $minioReplicas 1 }}
  {{- fail "minio.replicas must be 1 because this chart configures standalone MinIO" }}
  {{- end }}
  replicas: {{ $minioReplicas }}
  serviceName: "{{ .Release.Name }}-minio-headless"
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: {{ .Values.minio.tolerations.notReady | default 20 }}
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: {{ .Values.minio.tolerations.unreachable | default 20 }}
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-loki-secret"
                  key: S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-loki-secret"
                  key: S3_SECRET_ACCESS_KEY
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.minio.resources.requests.cpu | default "100m" }}
              memory: {{ .Values.minio.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.minio.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.minio.resources.limits.memory | default "1Gi" }}
          volumeMounts:
            - name: minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: 
          - "ReadWriteOnce"
        storageClassName: {{ .Values.minio.persistence.storageClassName | default "longhorn" }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size | default "5Gi" }}