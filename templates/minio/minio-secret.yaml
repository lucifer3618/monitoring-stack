apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-minio-secret"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  MINIO_ACCESS_KEY_ID: {{ .Values.minio.accessKeyId | default "admin" | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.secretAccessKey | default "minioadmin123" | quote }}