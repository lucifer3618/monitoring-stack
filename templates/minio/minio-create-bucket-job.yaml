apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-minio-create-bucket"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: "minio/mc:RELEASE.2024-01-16T16-06-34Z"
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-loki-secret"
                  key: S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-loki-secret"
                  key: S3_SECRET_ACCESS_KEY
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Wait until MinIO API responds
              until mc alias set myminio http://{{ .Release.Name }}-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for MinIO S3 API..."
                sleep 2
              done
              # Create bucket if it does not already exist
              mc mb --ignore-existing myminio/{{ .Values.loki.s3.bucketName | default "loki-data" }}
              echo "Bucket initialization complete."