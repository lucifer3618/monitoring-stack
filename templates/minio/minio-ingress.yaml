{{- if .Values.minio.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-minio-console"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # NGINX-specific tuning for MinIO UI & WebSockets
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/websocket-services: "{{ .Release.Name }}-minio"
spec:
  ingressClassName: {{ .Values.minio.ingress.className | default "nginx" }}
  rules:
    - host: {{ .Values.minio.ingress.host | default "minio.local" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ .Release.Name }}-minio"
                port:
                  number: 9001
{{- end }}