apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-loki-secret"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: {{ .Values.loki.s3.accessKeyId | default "admin" | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.loki.s3.secretAccessKey | default "minioadmin123" | quote }}