apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-tempo-secret"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: {{ .Release.Name }}
stringData:
  S3_ACCESS_KEY_ID: {{ .Values.tempo.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.tempo.s3.secretAccessKey | quote }}